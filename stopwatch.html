<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    .stopWatch{   
    background:#1E293B;
    width: min(92vw, 450px);
    min-height: 385px;
    padding: 16px;
    border-radius: 5px;
    }
    .toptext{
      display: block;
      margin-bottom: 13px;
    }
    .stopWdis{
      margin: 24px auto 0;
      padding: 15px;
      font-size: clamp(24px, 5vw, 35px);
      background-color: rgb(25, 69, 105);
      color: white;
      border-radius: 5px;
      text-align: center;
    }
    .stopwbtns{
      background-color: rgb(13, 51, 123);
      width: min(100%, 230px);
      display: flex;
      gap: 5px;
      margin: 40px auto 0;
      padding: 7px;
      border-radius: 5px;

    }
    .stopwbtn{
      flex: 1;
      background-color: rgb(25, 69, 105);
      font-size: clamp(16px, 3.5vw, 20px);
      border-radius: 5px;
      border: none;
      color: white;
      transition: all 0.3s ease;
      padding: 8px 6px;
    }
    .stopwbtn:hover {
  background-color: rgb(21, 52, 78);
  color: white;
  transform: scale(1.05);
}

/* Active (when clicked) effect */
.stopwbtn:active{
  transform: scale(0.95);
}
    .cs-milsec{
      font-size: 27px;
    }
    .cs-reset{
      width: 30px;
      mix-blend-mode: multiply;
      /* removes background */
    }
    .closeStopw{
      float: right;
      margin-right: 10px;
      margin-top: 10px;
      padding: 2px 5px;
      cursor: pointer;
    }
    .closeStopw:hover{
      transform: scale(0.95);
      background-color: #c62727;
      border: none;
    }

    @media (max-width: 600px) {
      .stopWatch {
        width: min(96vw, 450px);
        padding: 12px;
      }

      .stopWdis {
        margin-top: 20px;
        font-size: clamp(24px, 7vw, 35px);
      }
    }

    @media (max-width: 420px) {
      .stopwbtns {
        flex-wrap: wrap;
      }

      .stopwbtn {
        min-width: 0;
      }
      .stopWdis {
        font-size: clamp(24px, 7vw, 35px);
      }
    }
  </style>
<body>
  <div class="stopWatch">
    <button class="closeStopw">X</button>
    <h1 style="color: white;">Stopwatch</h1>
    <div class="stopWdis">
      <span class="toptext">Are you ready?</span>
      <span class="stopTime" id="minutesSt">00</span>
      <span>:</span>
      <span class="stopTime" id="secondsSt">00</span>
      <span>.</span>
      <span class="stopTime cs-milsec" id="millisecondsSt">00</span>
      
    </div>
  <div class="stopwbtns">
  <button class="stopwbtn js-startBtn">Start</button>
  <button class="stopwbtn js-stopBtn">Stop</button>
  <button class="stopwbtn js-resetBtn"><img class="cs-reset" src="Reset.png" alt=""></button>
  </div>
  </div>
<script src="stopwatch.js"></script>

</body>
</html>
